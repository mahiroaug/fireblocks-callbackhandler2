AWSTemplateFormatVersion: "2010-09-09"
Description: "Fireblocks Callback Handler - Cosigner Stack (EC2, Nitro Enclave)"

Parameters:
  ProjectName:
    Type: String
    Default: fireblocks-cbh
    Description: Project name for resource naming

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prod, cm]
    Description: Environment name

  InstanceType:
    Type: String
    Default: c5.xlarge
    AllowedValues: [c5.xlarge, c5a.xlarge]
    Description: EC2 instance type for Cosigner (Fireblocks-supported Nitro Enclave size)

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI ID from AWS public SSM parameters

  EbsVolumeSize:
    Type: Number
    Default: 30
    Description: Root EBS volume size in GB for Cosigner instance

  KeyPairName:
    Type: String
    Description: EC2 Key Pair name for emergency access
    Default: ""

  CosignerAppLogGroupName:
    Type: String
    Default: ""
    Description: CloudWatch Log Group for customer_cosigner app logs (empty = /fireblocks/ProjectName-customer_cosigner-Environment)

  CosignerLogRetentionDays:
    Type: Number
    Default: 90
    Description: Retention in days for customer_cosigner application logs

  CosignerAppLogKmsKeyArn:
    Type: String
    Default: ""
    Description: Optional KMS key ARN for encrypting customer_cosigner application logs

  CosignerAlarmNotificationEmail:
    Type: String
    Default: ""
    Description: Optional email address for cosigner ERROR alarm notifications (requires subscription confirmation)

  CosignerSnsKmsKeyArn:
    Type: String
    Default: ""
    Description: Optional KMS key ARN for encrypting the cosigner alarm SNS topic

Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, ""]]
  UseDefaultAppLogGroupName: !Equals [!Ref CosignerAppLogGroupName, ""]
  HasAppLogKmsKey: !Not [!Equals [!Ref CosignerAppLogKmsKeyArn, ""]]
  HasAlarmNotificationEmail: !Not [!Equals [!Ref CosignerAlarmNotificationEmail, ""]]
  HasSnsKmsKey: !Not [!Equals [!Ref CosignerSnsKmsKeyArn, ""]]

Resources:
  # S3 Bucket for Cosigner configuration and state
  CosignerS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-cosigner-${Environment}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: cosigner
        - Key: Project
          Value: fireblocks-callback-handler
        - Key: ManagedBy
          Value: cloudformation

  # Restrict the persistent storage bucket to the Cosigner EC2 role, as required by Fireblocks.
  CosignerS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CosignerS3Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:ListBucketMultipartUploads
              - s3:AbortMultipartUpload
              - s3:GetObjectAcl
              - s3:PutObjectAcl
              - s3:RestoreObject
            Resource:
              - !GetAtt CosignerS3Bucket.Arn
              - !Sub "${CosignerS3Bucket.Arn}/*"
            Condition:
              ArnNotEquals:
                aws:PrincipalArn:
                  Fn::ImportValue: !Sub ${ProjectName}-${Environment}-CosignerRole-ARN

  # CloudWatch Log Group for Cosigner init/system logs (legacy)
  CosignerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/ec2/${ProjectName}-cosigner-${Environment}"
      RetentionInDays: 30

  # CloudWatch Log Group for customer_cosigner application logs (primary source)
  CosignerAppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !If
        - UseDefaultAppLogGroupName
        - !Sub "/fireblocks/${ProjectName}-customer_cosigner-${Environment}"
        - !Ref CosignerAppLogGroupName
      RetentionInDays: !Ref CosignerLogRetentionDays
      KmsKeyId: !If [HasAppLogKmsKey, !Ref CosignerAppLogKmsKeyArn, !Ref "AWS::NoValue"]

  # CloudWatch Agent configuration for /var/log/customer_cosigner.log
  CosignerCloudWatchAgentConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ProjectName}/${Environment}/cloudwatch-agent/customer-cosigner
      Type: String
      Description: CloudWatch Agent configuration for customer_cosigner application logs
      Value: !Sub
        - |
          {
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/customer_cosigner.log",
                      "log_group_name": "${AppLogGroupName}",
                      "log_stream_name": "{instance_id}",
                      "timezone": "UTC"
                    }
                  ]
                }
              }
            }
          }
        - AppLogGroupName: !If
            - UseDefaultAppLogGroupName
            - !Sub "/fireblocks/${ProjectName}-customer_cosigner-${Environment}"
            - !Ref CosignerAppLogGroupName
      Tags:
        Environment: !Ref Environment
        Stack: cosigner
        Project: fireblocks-callback-handler
        ManagedBy: cloudformation

  # Cosigner EC2 Instance
  CosignerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref EbsVolumeSize
            VolumeType: gp3
            Encrypted: true
      SubnetId:
        Fn::ImportValue: !Sub ${ProjectName}-${Environment}-PrivateSubnet-ID
      SecurityGroupIds:
        - Fn::ImportValue: !Sub ${ProjectName}-${Environment}-CosignerSecurityGroup-ID
      IamInstanceProfile:
        Fn::ImportValue: !Sub ${ProjectName}-${Environment}-CosignerInstanceProfile-Name
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref "AWS::NoValue"]
      EnclaveOptions:
        Enabled: true
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf update -y
          dnf install -y amazon-ssm-agent amazon-cloudwatch-agent aws-nitro-enclaves-cli

          # Enable and start SSM Agent
          systemctl enable amazon-ssm-agent
          systemctl start amazon-ssm-agent

          # CloudWatch Agent package only; configuration is applied via SSM State Manager Association
          systemctl enable amazon-cloudwatch-agent

          # Configure Nitro Enclaves
          usermod -aG ne ec2-user

          # Configure Nitro Enclaves allocator
          systemctl enable nitro-enclaves-allocator.service
          systemctl start nitro-enclaves-allocator.service

          # Create cosigner directory
          mkdir -p /home/ec2-user/cosigner
          chown ec2-user:ec2-user /home/ec2-user/cosigner

          # Log installation completion
          echo "Cosigner instance initialization completed" >> /var/log/cosigner-init.log

          # Store environment variables for later use
          echo "ENVIRONMENT=${Environment}" >> /home/ec2-user/.env
          chown ec2-user:ec2-user /home/ec2-user/.env
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-cosigner-${Environment}
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: cosigner
        - Key: Type
          Value: CosignerInstance
        - Key: Project
          Value: fireblocks-callback-handler
        - Key: ManagedBy
          Value: cloudformation

  # Apply CloudWatch Agent configuration to Cosigner instance (works for existing instances without replacement)
  CosignerCloudWatchAgentAssociation:
    Type: AWS::SSM::Association
    DependsOn:
      - CosignerInstance
      - CosignerCloudWatchAgentConfigParameter
    Properties:
      Name: AmazonCloudWatch-ManageAgent
      AssociationName: !Sub ${ProjectName}-cosigner-cwagent-${Environment}
      Targets:
        - Key: InstanceIds
          Values:
            - !Ref CosignerInstance
      Parameters:
        action:
          - configure
        mode:
          - ec2
        optionalConfigurationSource:
          - ssm
        optionalConfigurationLocation:
          - !Sub /${ProjectName}/${Environment}/cloudwatch-agent/customer-cosigner
        optionalRestart:
          - "yes"
      ScheduleExpression: rate(30 minutes)
      ApplyOnlyAtCronInterval: false

  # SNS topic for cosigner ERROR alarms
  CosignerErrorAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${ProjectName}-cosigner-error-alarm-${Environment}
      DisplayName: !Sub "Cosigner ERROR Alarm (${Environment})"
      KmsMasterKeyId: !If [HasSnsKmsKey, !Ref CosignerSnsKmsKeyArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: cosigner
        - Key: Project
          Value: fireblocks-callback-handler
        - Key: ManagedBy
          Value: cloudformation

  CosignerErrorAlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmNotificationEmail
    Properties:
      TopicArn: !Ref CosignerErrorAlarmTopic
      Protocol: email
      Endpoint: !Ref CosignerAlarmNotificationEmail

  # Metric filter for ERROR lines in customer_cosigner logs
  CosignerErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CosignerAppLogGroup
      FilterPattern: '"customer_cosigner:" ERROR'
      MetricTransformations:
        - MetricNamespace: Fireblocks/Cosigner
          MetricName: ErrorCount
          MetricValue: "1"
          DefaultValue: 0

  CosignerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-cosigner-error-count-${Environment}
      AlarmDescription: "ERROR count in customer_cosigner application logs"
      Namespace: Fireblocks/Cosigner
      MetricName: ErrorCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CosignerErrorAlarmTopic

  # CloudWatch Alarms for Cosigner EC2 metrics
  HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-cosigner-high-cpu-${Environment}
      AlarmDescription: "High CPU utilization for Cosigner instance"
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref CosignerInstance
      TreatMissingData: notBreaching

  HighMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-cosigner-high-memory-${Environment}
      AlarmDescription: "High memory utilization for Cosigner instance (requires CWAgent metrics collection; not enabled by default)"
      MetricName: mem_used_percent
      Namespace: CWAgent
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref CosignerInstance
      TreatMissingData: notBreaching

  StatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-cosigner-status-check-${Environment}
      AlarmDescription: "Status check failed for Cosigner instance"
      MetricName: StatusCheckFailed
      Namespace: AWS/EC2
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref CosignerInstance
      TreatMissingData: notBreaching

Outputs:
  CosignerInstanceId:
    Description: Cosigner EC2 Instance ID
    Value: !Ref CosignerInstance
    Export:
      Name: !Sub ${ProjectName}-${Environment}-CosignerInstance-ID

  CosignerPrivateIP:
    Description: Cosigner EC2 Instance Private IP
    Value: !GetAtt CosignerInstance.PrivateIp
    Export:
      Name: !Sub ${ProjectName}-${Environment}-CosignerInstance-PrivateIP

  CosignerLogGroupName:
    Description: CloudWatch Log Group Name for Cosigner init/system logs
    Value: !Ref CosignerLogGroup
    Export:
      Name: !Sub ${ProjectName}-${Environment}-CosignerLogGroup-Name

  CosignerAppLogGroupName:
    Description: CloudWatch Log Group Name for customer_cosigner application logs
    Value: !Ref CosignerAppLogGroup
    Export:
      Name: !Sub ${ProjectName}-${Environment}-CosignerAppLogGroup-Name

  CosignerCloudWatchAgentConfigParameterName:
    Description: SSM Parameter name for CloudWatch Agent configuration
    Value: !Ref CosignerCloudWatchAgentConfigParameter
    Export:
      Name: !Sub ${ProjectName}-${Environment}-CosignerCloudWatchAgentConfig-Name

  CosignerCloudWatchAgentAssociationId:
    Description: SSM State Manager Association ID for CloudWatch Agent
    Value: !Ref CosignerCloudWatchAgentAssociation
    Export:
      Name: !Sub ${ProjectName}-${Environment}-CosignerCloudWatchAgentAssociation-ID

  CosignerErrorAlarmTopicArn:
    Description: SNS Topic ARN for cosigner ERROR alarms
    Value: !Ref CosignerErrorAlarmTopic
    Export:
      Name: !Sub ${ProjectName}-${Environment}-CosignerErrorAlarmTopic-ARN

  SessionManagerCommand:
    Description: AWS CLI command to connect to Cosigner via Session Manager
    Value: !Sub "aws ssm start-session --target ${CosignerInstance} --region ${AWS::Region}"
    Export:
      Name: !Sub ${ProjectName}-${Environment}-SessionManager-Command

  CosignerS3BucketName:
    Description: S3 Bucket Name for Cosigner
    Value: !Ref CosignerS3Bucket
    Export:
      Name: !Sub ${ProjectName}-${Environment}-CosignerS3Bucket-Name

  CosignerS3BucketArn:
    Description: S3 Bucket ARN for Cosigner
    Value: !GetAtt CosignerS3Bucket.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-CosignerS3Bucket-ARN
